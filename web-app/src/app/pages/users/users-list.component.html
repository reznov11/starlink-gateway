<div class="users-container">
  <div class="custom_table">
    <app-dynamic-table
      [columns]="userColumns"
      [data]="displayedUsers"
      [totalItems]="users.length / pageSize"
      [pageSize]="pageSize"
      [currentPage]="currentPage"
      [pageSizeOptions]="pageSizeOptions"
      (pageChanged)="onPageChange($event)"
      (actionClicked)="handleAction($event)">
    </app-dynamic-table>
  </div>
</div>

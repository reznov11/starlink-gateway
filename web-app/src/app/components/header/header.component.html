<div class="header-container">
  <div class="welcome-container">
    <h2 class="welcome-text">{{ pageTitle }}</h2>
  </div>
  <div class="actions-container">
    <button *ngIf="!isProfilePage && !isFormConstructor" class="login-btn" mat-flat-button (click)="openComponent()">
      {{ headerService.currentComponentButtonTest }}
    </button>

    <button *ngIf="isProfilePage" class="logout-btn" mat-flat-button (click)="logout()">
      Выйти из профиля
    </button>
  </div>
</div>
